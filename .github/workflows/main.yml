name: Build Android APK with LockScreen Background Audio
​on:
push:
branches:
- main
- master
workflow_dispatch:
​jobs:
build:
name: Build Android Audio Player APK
runs-on: ubuntu-latest
steps:
- name: Checkout Code
uses: actions/checkout@v4
​- name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: 20
​- name: Setup Java JDK 17
uses: actions/setup-java@v4
with:
distribution: temurin
java-version: 17
​- name: Setup Android SDK
uses: android-actions/setup-android@v3
​- name: Build Android App with Background Audio Permissions
run: |
mkdir -p www && cp index.html www/
npm init -y
npm install @capacitor/core @capacitor/android @capacitor/cli
npx cap init AuraPulse com.arulkrish.aurapulse --web-dir www
npx cap add android
​# Inject Background Audio & Lock Screen Permissions directly into AndroidManifest.xml
MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
sed -i '/</manifest>/i 
<uses-permission android:name="android.permission.WAKE_LOCK" />
<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />' $MANIFEST_FILE
​npx cap sync android
cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace
​- name: Upload Clean APK
uses: actions/upload-artifact@v4
with:
name: AuraPulse-Studio-Pro-APK
path: android/app/build/outputs/apk/debug/app-debug.apk
retention-days: 14
