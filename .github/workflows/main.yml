name: Build Android APK with LockScreen Background Audio
​on:
push:
branches:
- main
- master
workflow_dispatch:
​jobs:
build:
name: Build Android Audio Player APK
runs-on: ubuntu-latest
steps:
- name: Checkout Code
uses: actions/checkout@v4
​- name: Set up Java JDK 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: Set up Node.js
uses: actions/setup-node@v4
with:
node-version: 20
​- name: Prepare Capacitor App
run: |
mkdir -p www
cp index.html www/index.html
​# Create minimal clean package.json
cat << 'EOF' > package.json
{
"name": "aurapulse-studio",
"version": "3.8.0",
"dependencies": {
"@capacitor/core": "^6.1.2",
"@capacitor/android": "^6.1.2"
},
"devDependencies": {
"@capacitor/cli": "^6.1.2"
}
}
EOF
​# Create capacitor configuration
cat << 'EOF' > capacitor.config.json
{
"appId": "com.arulkrish.aurapulse",
"appName": "AuraPulse Studio",
"webDir": "www",
"bundledWebRuntime": false,
"server": {
"androidScheme": "https",
"cleartext": true
},
"android": {
"allowMixedContent": true
}
}
EOF
​# Install packages and add android platform
npm install
npx cap add android
​# Inject Lockscreen & Background Audio permissions safely
python3 -c "
manifest_file = 'android/app/src/main/AndroidManifest.xml'
with open(manifest_file, 'r', encoding='utf-8') as f:
content = f.read()
​perms = '''
<uses-permission android:name="android.permission.WAKE_LOCK" />
<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
'''
​if '<application' in content:
content = content.replace('<application', perms + '\n    <application')
# Enable hardware acceleration and clear text traffic
content = content.replace('<application', '<application android:hardwareAccelerated="true" android:usesCleartextTraffic="true"')
​with open(manifest_file, 'w', encoding='utf-8') as f:
f.write(content)
print('Permissions successfully configured!')
"
​npx cap sync android
​- name: Build Debug APK with Gradle
run: |
cd android
chmod +x gradlew
./gradlew assembleDebug --no-daemon
​- name: Upload Clean APK Artifact
uses: actions/upload-artifact@v4
with:
name: AuraPulse-Studio-Pro-APK
path: android/app/build/outputs/apk/debug/app-debug.apk
retention-days: 14
